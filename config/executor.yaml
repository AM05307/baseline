# executor 실행 설정 (executor/config_files.load_executor_config가 읽는다. 바뀌면 config_history에 남는다)

# 체결 시점: next_open(기본) = t일 종가로 결정 → t+1일 시가 체결. same_close = t일 종가로 결정·체결(2026-10-19 이전 기본).
# 섀도·엔진·백테스트(analysis/what_if)가 같은 값을 쓴다. 모의투자는 장 시작 전(08:30~09:00) 시장가 주문으로 시가 단일가에
# 참여시키는 것을 전제로 한다 — KIS 모의투자에서 장 전 주문 접수가 되는지는 확인 필요(EXECUTOR.md).
fill: next_open

# 단순 보유 비교 종목 — 단계별 성과·승격 기준(MDD 비교)에 전부 쓴다. 시세는 baseline.db에서 읽기만 한다.
# 069500(KODEX 200)은 collectors/kr_market.py에 추가했다 — 수집 전에는 "데이터 없음"으로 나온다.
benchmarks: ["000660", "069500"]

# 목표 비중과 실제로 맞출 수 있는 비중(정수 주식)의 차이가 이 값(%p)을 넘으면 경고(주문은 막지 않음). 시작 기본값 — 미확정.
max_weight_gap_pctp: 10

# 일일 운영 제한(planner.apply_daily_limits) — 보수적 시작 기본값, 미확정(백테스트로 고른 값 아님). 0이면 그 제한은 끔.
#  - max_daily_loss_pct: 운용분이 직전 스냅샷 대비 이 % 이상 줄었으면 그날 신규 매수 보류(매도는 진행)
#  - max_orders_per_day: 같은 결정일 주문 수가 넘으면 계획 전체 거부(일부만 보내지 않음). 하루 1회·종목 1~2개 기준
#  - cooldown_days: 강등·정지(halt/review_required) 사건일로부터 이 달력일 수 이내면 신규 매수 보류(해제 뒤에도 적용)
# 전부 executor.db(스냅샷·주문·사건)에서 계산하므로 재시작해도 유지된다.
daily_limits:
  max_daily_loss_pct: 3.0
  max_orders_per_day: 4
  cooldown_days: 5

# 단일 종목 집중(planner.cap_single_weights) — 개별 종목 목표 비중 상한(운용 자본 대비). 미확정.
# exempt(지수 ETF)는 상한을 받지 않는다. 섀도는 단계 비중(stage_weights)에 먼저 적용하고 비교 기준 백테스트도 같은 값을 쓴다.
concentration:
  max_single_weight: 0.30
  exempt: ["069500", "SPY", "QQQ"]

# 한도 초과로 계획이 거부된 실행(cap_rejected)이 연속 이 횟수에 닿을 때마다 주문 오류 1건으로 센다.
# 1회는 강등 사유에서 제외(사용자 결정 2026-10-18).
cap_rejected_streak: 3

# 킬 스위치 파일 — 이 파일이 있으면(내용 무관) 모든 주문과 섀도 실행을 막는다. 저장소 루트 기준 경로.
kill_switch_file: KILL_SWITCH

# KRX 휴장일 캘린더(대체공휴일 포함). 범위 밖 날짜는 "판정 불가"로 실행하지 않는다.
calendar_file: config/krx_holidays.yaml

# 데이터 신선도: 결정일 종가가 있어야 하고, 신호값은 결정일 기준으로 최신이어야 한다.
freshness:
  max_foreign_signal_age_days: 4   # 해외 세션 신호(결정일 이전 값)의 원래 날짜가 결정일보다 이만큼 넘게 오래되면 실행 안 함

# 섀도 실행기 — baseline 위험 점수 모델 그대로 목표 비중을 정한다.
# 대상 069500(KODEX 200, 2026-10-19 변경). 000660은 benchmarks의 비교 기준으로만 남긴다. 069500은 지수 ETF라
# concentration 예외 목록에 있어 단계 비중(100/66/33/0%)이 그대로 적용된다.
# 주의: 위험 점수 신호 중 일부는 000660 시세로 계산된 것이다(docs/signal_applicability_069500.md 참고, 제외·대체는 제안만).
shadow:
  strategy: risk_score
  ticker: "069500"
  stage_weights: [1.0, 0.66, 0.33, 0.0]   # 정상, 1단계, 2단계, 3단계 (analysis/what_if.DEFAULT_STAGE_WEIGHTS와 같은 값)
  # 위험 점수 방식: group(기본, 2026-10-19) = 신호 그룹 균등 가중치 + 기준 기간(2005~2018) 백분위 단계(analysis/group_score)
  #                 weighted(옵션) = 예전 적중률 가중치(weight_history) + 60/80점
  score_method: group
  combo_stage: 3
