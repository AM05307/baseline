# 하워드 막스(오크트리) 공개 메모 수집 설정 — collectors/marks_memos.py
#
# 수집 전 확인 단계(둘 다 통과해야 자동 수집):
#   1. 이용약관: 코드로 판정할 수 없다. 사람이 terms_url을 직접 읽고, 개인 참고용 목록 수집이 허용되는지 확인한 뒤
#      terms_reviewed: true, reviewed_on, note를 채운다. 그 전에는 수집하지 않고 "수동 입력 필요"로 기록한다.
#   2. robots.txt: 수집할 때마다 코드가 확인한다. 목록·메모 URL을 허용하지 않으면 수집하지 않는다.
# 허용되지 않으면 수동 입력: python collectors/marks_memos.py --manual --title ... --url ... --date ...
#
# URL·페이지 구조는 2026-10-18 기준 확인하지 못했다(이 세션은 실제 네트워크 호출을 하지 않음) — 첫 실행 때 확인할 것.

list_url: "https://www.oaktreecapital.com/insights/memos"
robots_url: "https://www.oaktreecapital.com/robots.txt"
terms_url: "https://www.oaktreecapital.com/legal/terms-of-use"   # 확인 필요(첫 실행 때 실제 약관 페이지 주소로 교체)
terms_reviewed: false
reviewed_on: null
note: ""
user_agent: "baseline-personal-research/0.1 (personal, non-commercial; weekly)"
request_interval_seconds: 3     # 메모 페이지 사이 대기 — 주 1회 새 메모 몇 건만 받으므로 느려도 된다
